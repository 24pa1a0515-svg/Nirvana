    if (!b.slots.length) return `<div class="banner-warn" style="margin:0">${ic('clock')}<span>No slots on this date — the doctor is unavailable. Try another date.</span></div>`;
    const free = b.slots.filter((x) => x.available).length;
    return `<div style="display:flex;flex-wrap:wrap;gap:6px">${b.slots.map((x) => `<button type="button" class="btn sm mono ${b.time === x.time ? 'primary' : ''}" ${x.available ? '' : 'disabled'} title="${x.available ? 'Available' : x.reason === 'booked' ? 'Already booked' : 'Time passed'}" style="min-width:66px;${x.reason === 'booked' ? 'text-decoration:line-through' : ''}" onclick="P.pickSlot('${x.time}')">${x.time}</button>`).join('')}</div>
      <span class="hint">${free} of ${b.slots.length} slots free${b.time ? ` · selected <b>${esc(b.time)}</b>` : ''}</span>`;
  },
  async loadSlots(date) {
    const b = S.book; b.date = date; b.time = null; b.slotsLoading = true; b.slotsErr = null;
    const g = $('#slot-grid'); if (g) g.innerHTML = P.slotGrid();
    try { const r = await api('slots', { query: { doctor_id: b.doctor_id, date, tz_offset: new Date().getTimezoneOffset() } }); if (S.book !== b || b.date !== date) return; b.slots = r.slots; b.slotsDate = date; }
    catch (x) { b.slots = []; b.slotsDate = date; b.slotsErr = x.message; }
    b.slotsLoading = false;
    const g2 = $('#slot-grid'); if (g2) g2.innerHTML = P.slotGrid();
  },
  pickSlot(t) { S.book.time = t; const g = $('#slot-grid'); if (g) g.innerHTML = P.slotGrid(); },
  afterBook() { const b = S.book; if (b.step === 4 && (!b.slots || b.slotsDate !== b.date) && !b.slotsLoading) P.loadSlots(b.date); },
  hospCards(list, total) {
    if (!total) return `<div class="card">${empty('home', 'No hospitals currently registered.', 'Hospitals appear here once a Hospital Administrator registers them on Q-NIRVANA.')}</div>`;
    if (!list.length) return `<div class="card">${empty('home', 'No hospital matches your search')}</div>`;
    return `<div class="grid g3">${list.map((h, i) => `<button class="card pick rise" style="animation-delay:${i * 0.03}s" onclick="P.pickHospital(${h.id})"><div class="dept-ico i-${['blue', 'purple', 'green'][i % 3]}">${ic('home')}</div><h3>${esc(h.name)}</h3><p class="sub">${esc(h.address || 'Address not provided')}</p>
      <div class="meta"><span>${ic('grid')} ${h.departments_count} departments</span><span>${ic('steth')} ${h.available_doctors}/${h.doctors_count} doctors available</span></div></button>`).join('')}</div>`;
  },
  filterHosp() { const all = S.d.book?.hospitals || [], qy = (S.book.q || '').toLowerCase(); $('#hosp-results').innerHTML = P.hospCards(all.filter((h) => !qy || h.name.toLowerCase().includes(qy) || (h.address || '').toLowerCase().includes(qy)), all.length); },
  bookSet(p) { const reload = p.step !== undefined && ((p.step === 1) !== (S.book.step === 1) || p.hospital_id); Object.assign(S.book, p); if (reload) loadTab(true); else rerender(); window.scrollTo(0, 0); },
  pickHospital(id) { const h = (S.d.book?.hospitals || []).find((x) => x.id === id); P.bookSet({ step: 2, hospital_id: id, hospital_name: h?.name || '' }); },
  pickDept(id) { const d = (S.d.book?.doctors || []).find((x) => x.department_id === id); P.bookSet({ step: 3, department_id: id, dept: d?.department || '' }); },
  pickDoctor(id) { P.bookSet({ step: 4, doctor_id: id, slots: null, time: null }); },
  async book(e) {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    if (!f.appointment_date || f.appointment_date < localToday()) { $('#book-err').innerHTML = `<div class="form-err">Please choose today or a future date</div>`; return false; }
    if (!S.book.time) { $('#book-err').innerHTML = `<div class="form-err">Please select an available slot</div>`; return false; }
    const btn = $('#book-btn'); busyBtn(btn, true, 'Generating token…');
    try {
      const r = await api('appointments', { method: 'POST', body: { hospital_id: S.book.hospital_id, department_id: S.book.department_id, doctor_id: S.book.doctor_id, appointment_date: f.appointment_date, appointment_time: S.book.time, reason: f.reason, tz_offset: new Date().getTimezoneOffset() } });
      S.book = { step: 5, result: r }; rerender(); loadNotifs();
    } catch (x) { $('#book-err').innerHTML = `<div class="form-err">${esc(x.message)}</div>`; busyBtn(btn, false); if (/slot/i.test(x.message)) P.loadSlots(S.book.date); }
    return false;
  },

  /* history */
  async loadHistory() { const [appts, cons] = await Promise.all([api('appointments'), api('consultations')]); return { appts, cons }; },
  viewHistory({ appts, cons }) {
    const cm = Object.fromEntries(cons.map((c) => [c.appointment_id, c]));
    if (!appts.length) return `<div class="card">${empty('history', 'No appointments available.', 'Your appointments, diagnoses and prescriptions will appear here.', `<button class="btn primary" onclick="P.newBooking()">Book appointment</button>`)}</div>`;
    return `<div class="card"><div class="card-h"><h3>${ic('history')} Appointment history</h3><span class="sub">${appts.length} records</span></div>
      ${appts.map((a) => { const c = cm[a.id]; return `<details class="dx list-item" style="display:block" ${c && a === appts.find((x) => cm[x.id]) ? 'open' : ''}><summary style="display:flex;gap:12px;align-items:center">
        ${avatar(a.doctor_name)}<div style="flex:1;min-width:0"><b>${esc(a.doctor_name)}</b><div class="sub">${esc(a.hospital_name)} · ${esc(a.department)} · ${fmtDate(a.appointment_date)} ${esc(a.appointment_time || '')}${a.reason ? ' · ' + esc(a.reason) : ''}</div></div>
        <span class="qchip">${esc(a.token_code || '—')}</span>${chip(a.status)}</summary>
        ${c ? `<div class="rx"><div><small>Diagnosis</small><pre>${esc(c.diagnosis)}</pre></div>${c.prescription ? `<div><small>Prescription</small><pre>${esc(c.prescription)}</pre></div>` : ''}${c.notes ? `<div><small>Doctor's notes</small><pre>${esc(c.notes)}</pre></div>` : ''}
          ${c.follow_up_date ? `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><span><small>Follow-up</small><br><b>${fmtDate(c.follow_up_date)}</b></span><button class="btn sm primary" onclick="P.followUp(${a.id}, '${esc(c.follow_up_date)}')">${ic('calPlus')} Book follow-up</button></div>` : ''}</div>`
          : a.status === 'waiting' ? `<div class="actions"><button class="btn sm ghost danger" onclick="P.cancel(${a.id}, this)">Cancel</button></div>` : ''}
      </details>`; }).join('')}</div>`;
  },
  followUp(apptId, date) { const a = (S.d.history?.appts || []).find((x) => x.id === apptId); if (!a) return; S.book = { step: 4, slots: null, time: null, hospital_id: a.hospital_id, hospital_name: a.hospital_name, department_id: a.department_id, dept: a.department, doctor_id: a.doctor_id, date: date < localToday() ? localToday() : date, reason: 'Follow-up consultation' }; go('book'); },

  /* emergency */
  async loadEmergency() { const [list, hospitals] = await Promise.all([api('emergency'), api('hospitals')]); S.emHospitals = hospitals; return { list, hospitals }; },
  viewEmergency({ list, hospitals }) {
    const active = list.find((e) => E_ACTIVE.includes(e.status));
    const past = list.filter((e) => e !== active);
    if (active) return `<div class="split"><div class="card"><div class="card-h"><h3>${ic('siren')} Emergency #${active.id} · ${esc(active.emergency_type)}</h3>${chip(active.status)}</div>
        ${etaBox(active)}<div class="mt">${mapSlot('pem', true)}</div>
        ${emMeta(active)}
        ${['requested', 'accepted', 'en_route'].includes(active.status) ? `<div class="actions"><button class="btn sm ghost danger" onclick="P.cancelEm(${active.id}, this)">${ic('x')} Cancel request</button></div>` : ''}</div>
      <div class="card"><div class="card-h"><h3>${ic('activity')} Live status</h3><span class="chip c-green"><span class="live-dot"></span> live</span></div>
        ${active.operator_phone ? `<a class="btn green block mb16" href="tel:${esc(active.operator_phone)}">${ic('phone')} Call ambulance crew</a>` : ''}
        ${emTimeline(active)}</div></div>`;
    const loc = S.sosLoc;
    return `<div class="split"><form class="card" onsubmit="return P.sos(event)" novalidate>
      <div class="sos"><div class="sos-btn">SOS</div><h3 style="font-size:20px">Request emergency ambulance</h3><p class="sub">The selected hospital's command centre and all available ambulances are alerted instantly.</p></div>
      <div id="sos-err"></div>
      ${hospitals.length ? `<div class="field"><label>Hospital *</label><select class="inp" name="hospital_id" id="sos-hosp" required><option value="">Select hospital…</option>${hospitals.map((h) => `<option value="${h.id}">${esc(h.name)}${h.address ? ' · ' + esc(h.address) : ''}</option>`).join('')}</select><span class="hint" id="sos-near">Share your GPS location to auto-select the nearest hospital.</span></div>` : `<div class="banner-warn">${ic('alert')}<span>No hospitals are registered on Q-NIRVANA yet — please call your national emergency number.</span></div>`}
      <div class="row"><div class="field"><label>Patient name *</label><input class="inp" name="patient_name" value="${esc(S.user.full_name)}" required></div><div class="field"><label>Contact phone *</label><input class="inp" name="contact_phone" value="${esc(S.user.phone || '')}" required></div></div>
      <div class="field"><label>Emergency type *</label><select class="inp" name="emergency_type" required><option value="">Select…</option>${EM_TYPES.map((t) => `<option>${t}</option>`).join('')}</select></div>
      <div class="field"><label>Severity</label><div class="sev">${['critical', 'high', 'moderate'].map((s) => `<label><input type="radio" name="severity" value="${s}" ${s === 'high' ? 'checked' : ''}><span class="s-${s}">${ST[s][0]}</span></label>`).join('')}</div></div>
      <div class="field"><label>Pickup location *</label>
        <button type="button" class="btn ${loc ? 'green' : ''}" onclick="P.locate(this)">${ic('pin')} ${loc ? `Location captured (${loc.lat.toFixed(4)}, ${loc.lng.toFixed(4)}) · ±${Math.round(loc.acc)}m` : 'Use my current GPS location'}</button>
        <input class="inp" name="pickup_address" placeholder="Landmark / address (recommended)"></div>
      <div class="field"><label>What happened?</label><textarea class="inp" name="description" placeholder="Symptoms, number of people, anything the crew should know"></textarea></div>
      <button class="btn danger lg block" id="sos-btn">${ic('siren')} Send emergency request</button></form>
      <div class="card"><div class="card-h"><h3>${ic('history')} Previous requests</h3></div>
        ${past.length ? past.map((e) => `<div class="list-item"><span class="avatar" style="background:var(--red-l);color:var(--red)">${ic('siren')}</span><div style="flex:1;min-width:0"><b>#${e.id} · ${esc(e.emergency_type)}</b><div class="sub">${fmtDate(e.created_at)} ${fmtTime(e.created_at)}${e.resource_label ? ' · ' + esc(e.resource_label) : ''}</div></div>${chip(e.status)}</div>`).join('') : '<p class="sub">No previous emergency requests.</p>'}
        <div class="banner-warn mt" style="margin-bottom:0">${ic('phone')}<span>In a life-threatening situation also call your national emergency number.</span></div></div></div>`;
  },
  afterEmergency({ list }) { const a = list.find((e) => E_ACTIVE.includes(e.status)); if (a) drawEmergencyMap('pem', a); },
  locate(btn) {
    if (!navigator.geolocation) return toast('GPS unavailable', 'Your browser does not support geolocation. Please enter the address.', 'warning');
    busyBtn(btn, true, 'Locating…');
    navigator.geolocation.getCurrentPosition((p) => {
      S.sosLoc = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy };
      busyBtn(btn, false); btn.classList.add('green'); P.nearest(); btn.innerHTML = `${ic('pin')} Location captured (${S.sosLoc.lat.toFixed(4)}, ${S.sosLoc.lng.toFixed(4)}) · ±${Math.round(S.sosLoc.acc)}m`;
    }, (err) => { busyBtn(btn, false); toast('Could not get location', err.message + ' — please type the address.', 'warning'); }, { enableHighAccuracy: true, timeout: 15000 });
  },
  nearest() {
    const sel = $('#sos-hosp'), loc = S.sosLoc; if (!sel || !loc) return;
    const withLL = (S.emHospitals || []).filter((h) => hasLL(h.lat, h.lng)).map((h) => ({ h, d: km(loc.lat, loc.lng, +h.lat, +h.lng) })).sort((a, b) => a.d - b.d);
    if (!withLL.length) return;
    if (!sel.value) sel.value = String(withLL[0].h.id);
    $('#sos-near').textContent = `Nearest: ${withLL[0].h.name} (${withLL[0].d.toFixed(1)} km)`;
  },
  async sos(e) {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    const err = (m) => { $('#sos-err').innerHTML = `<div class="form-err">${esc(m)}</div>`; };
    if ((f.patient_name || '').trim().length < 2) return err('Patient name is required'), false;
    if (!f.hospital_id) return err('Select the hospital to alert'), false;
    if (!f.emergency_type) return err('Select the emergency type'), false;
    if (!S.sosLoc && !(f.pickup_address || '').trim()) return err('Share your GPS location or type the pickup address'), false;
    const btn = $('#sos-btn'); busyBtn(btn, true, 'Alerting hospital…');
    try {
      await api('emergency', { method: 'POST', body: { ...f, pickup_lat: S.sosLoc?.lat, pickup_lng: S.sosLoc?.lng } });
      S.sosLoc = null; toast('Emergency request sent', 'Hospital alerted — tracking will start when an ambulance accepts.', 'emergency');
      e.target.reset(); await loadTab(false); loadNotifs();
    } catch (x) { err(x.message); busyBtn(btn, false); }
    return false;
  },
  async cancelEm(id, btn) { if (!confirm('Cancel this emergency request?')) return; await act(() => api('emergency', { method: 'PUT', body: { id, action: 'cancel' } }), btn, 'Emergency cancelled'); },
};

/* ================= DOCTOR ================= */
const D = {
  async loadQueue() { const q = await api('queue', { query: { date: localToday() } }); S.doctor = { ...S.doctor, ...q.doctor }; return q; },
  viewQueue(q) {
    const d = q.doctor, cur = q.current, active = cur && ['called', 'in_consultation'].includes(cur.status);
    const waiting = q.tokens.filter((t) => t.status === 'waiting');
    const patientBox = (t) => `<div class="patient-box">${avatar(t.patient_name, 48)}<div style="flex:1;min-width:0"><b style="font-size:16px">${esc(t.patient_name)}</b><div class="sub">${[age(t.dob) != null ? age(t.dob) + ' yrs' : '', t.gender, t.blood_group ? 'Blood ' + t.blood_group : ''].filter(Boolean).map(esc).join(' · ') || 'No profile details'}</div>${t.reason ? `<div style="font-size:13px;margin-top:4px"><b>Reason:</b> ${esc(t.reason)}</div>` : ''}</div>${t.patient_phone ? `<a class="btn sm" href="tel:${esc(t.patient_phone)}">${ic('phone')}</a>` : ''}</div>`;
    let nowCard;
    if (active && cur.status === 'called') nowCard = `<div class="sub">Patient called at ${fmtTime(cur.called_at)} — waiting for them to arrive</div>${patientBox(cur)}
      <div class="actions"><button class="btn green lg" onclick="D.q('start', this)">${ic('play')} Start consultation</button><button class="btn" onclick="D.q('recall', this)">${ic('bell')} Recall</button><button class="btn ghost danger" onclick="D.q('skip', this)">${ic('x')} Not present · skip</button></div>`;
    else if (active) nowCard = `<div class="sub">In consultation since ${fmtTime(cur.started_at)}</div>${patientBox(cur)}
      <form onsubmit="return D.complete(event)" novalidate><div id="cons-err"></div>
        <div class="field"><label>Diagnosis *</label><textarea class="inp" name="diagnosis" required placeholder="Clinical findings & diagnosis"></textarea></div>
        <div class="field"><label>Prescription</label><textarea class="inp" name="prescription" placeholder="e.g. Tab. Paracetamol 650mg — 1-0-1 × 5 days"></textarea></div>
        <div class="row"><div class="field"><label>Notes / advice</label><input class="inp" name="notes" placeholder="Diet, tests, precautions"></div><div class="field"><label>Follow-up date</label><input class="inp" type="date" name="follow_up_date" min="${localToday()}"></div></div>
        <label style="display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px;margin-bottom:12px"><input type="checkbox" name="auto_next" checked> Automatically call the next patient</label>
        <div class="actions"><button class="btn primary lg" id="cons-btn">${ic('check')} Complete consultation</button><button type="button" class="btn ghost danger" onclick="D.q('skip', this)">Skip</button></div></form>`;
    else nowCard = `<div style="text-align:center;padding:10px 0"><div class="sub">${cur ? `Last completed: <b class="mono">${esc(cur.token_code)}</b>` : 'No patient called yet today'}</div>
      <button class="btn grad lg mt" ${waiting.length && d.is_available ? '' : 'disabled'} onclick="D.q('call_next', this)">${ic('bell')} Call next patient${waiting.length ? ` (${esc(waiting[0].token_code)})` : ''}</button>
      <p class="hint mt">${!d.is_available ? 'You are marked unavailable — switch availability on to call patients.' : waiting.length ? `${waiting.length} patient(s) waiting` : 'The queue is empty.'}</p></div>`;
    return `<div class="card mb16" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 18px">
        <label class="switch"><input type="checkbox" ${d.is_available ? 'checked' : ''} onchange="D.toggleAvail(this)"><span></span></label>
        <div style="flex:1;min-width:180px"><b>${d.is_available ? 'Available for consultations' : 'Currently unavailable'}</b><div class="sub">${esc(d.avail_start || '')}–${esc(d.avail_end || '')} · ${d.room ? 'Room ' + esc(d.room) : 'No room set'} · Token series ${esc(d.token_prefix)}</div></div>
        <button class="btn sm" onclick="go('availability')">${ic('settings')} Edit availability</button></div>
      <div class="grid g4 mb16">${stat('users', 'blue', q.waiting_count, 'Waiting')}${stat('check', 'green', q.completed_count, 'Completed today')}${stat('ticket', 'purple', q.tokens.length, 'Tokens today')}${stat('clock', 'amber', q.avg + ' min', 'Avg consultation')}</div>
      <div class="split">
        <div class="card"><div class="card-h"><h3>${ic('activity')} Now serving</h3>${active ? chip(cur.status) : ''}</div>
          ${active ? `<div class="now-serving">${esc(cur.token_code)}</div>` : ''}${nowCard}</div>
        <div class="card"><div class="card-h"><h3>${ic('list')} Waiting queue</h3><span class="chip c-green"><span class="live-dot"></span> live</span></div>
          ${waiting.length ? waiting.map((t, i) => `<div class="list-item"><span class="qchip" style="font-size:14px">${esc(t.token_code)}</span><div style="flex:1;min-width:0"><b>${esc(t.patient_name)}</b><div class="sub">${[age(t.dob) != null ? age(t.dob) + 'y' : '', t.gender, t.reason].filter(Boolean).map(esc).join(' · ')}</div></div><span class="sub">~${(i + (active ? 1 : 0)) * q.avg}m</span></div>`).join('') : empty('users', 'No one waiting', 'New bookings appear here instantly.')}
          ${q.tokens.filter((t) => ['completed', 'skipped', 'cancelled'].includes(t.status)).length ? `<div class="mt"><div class="sub mb16" style="margin-bottom:8px">Done today</div><div class="qchips">${q.tokens.filter((t) => ['completed', 'skipped', 'cancelled'].includes(t.status)).map((t) => `<span class="qchip ${t.status}">${esc(t.token_code)}</span>`).join('')}</div></div>` : ''}
        </div></div>`;
  },
  async q(action, btn) { const labels = { call_next: 'Next patient called', start: 'Consultation started', skip: 'Token skipped', recall: 'Patient re-notified' }; await act(() => api('queue', { method: 'POST', body: { action, date: localToday() } }), btn, labels[action]); },
  async complete(e) {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    if ((f.diagnosis || '').trim().length < 2) { $('#cons-err').innerHTML = `<div class="form-err">Diagnosis is required</div>`; return false; }
    const btn = $('#cons-btn'); busyBtn(btn, true, 'Saving…');
    try {
      const r = await api('consultations', { method: 'POST', body: { ...f, auto_next: !!f.auto_next, date: localToday() } });
      toast('Consultation completed', r.next ? `Next patient ${r.next.token_code} has been called.` : 'Patient notified with prescription.', 'success');
      e.target.reset(); await loadTab(false);
    } catch (x) { $('#cons-err').innerHTML = `<div class="form-err">${esc(x.message)}</div>`; busyBtn(btn, false); }
    return false;
  },
  async toggleAvail(el) { try { S.doctor = { ...S.doctor, ...(await api('doctors', { method: 'PUT', body: { is_available: el.checked } })) }; toast(el.checked ? 'You are now available' : 'Marked unavailable', '', 'success'); loadTab(false); } catch (x) { el.checked = !el.checked; toast('Error', x.message, 'error'); } },

  async loadAppts() { if (!S.docDate) S.docDate = localToday(); return api('appointments', { query: { date: S.docDate } }); },
  viewAppts(list) {
    return `<div class="card"><div class="card-h"><h3>${ic('cal')} Appointments</h3><div style="display:flex;gap:8px;align-items:center"><input class="inp" type="date" value="${esc(S.docDate)}" onchange="S.docDate=this.value;this.defaultValue=this.value;loadTab(true)" style="width:auto"><button class="btn sm" onclick="S.docDate='${localToday()}';loadTab(true)">Today</button></div></div>
      ${list.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Token</th><th>Patient</th><th>Details</th><th>Reason</th><th>Status</th><th></th></tr></thead><tbody>${list.sort((a, b) => (a.token_number || 0) - (b.token_number || 0)).map((a) => `<tr>
        <td><span class="qchip">${esc(a.token_code || '—')}</span><div class="sub">${esc(a.appointment_time || '')}</div></td><td><b>${esc(a.patient_name)}</b><div class="sub">${esc(a.patient_phone)}</div></td>
        <td class="sub">${[age(a.dob) != null ? age(a.dob) + 'y' : '', a.gender, a.blood_group].filter(Boolean).map(esc).join(' · ') || '—'}</td><td>${esc(a.reason || '—')}</td><td>${chip(a.status)}</td>
        <td>${['waiting', 'called'].includes(a.status) ? `<button class="btn sm ghost" onclick="D.noShow(${a.id}, this)">No-show</button>` : ''}</td></tr>`).join('')}</tbody></table></div>` : empty('cal', 'No appointments for this date')}</div>`;
  },
  async noShow(id, btn) { await act(() => api('appointments', { method: 'PUT', body: { id, action: 'no_show' } }), btn, 'Marked as no-show'); },

  async loadCons() { return api('consultations'); },
  viewCons(list) {
    return `<div class="card"><div class="card-h"><h3>${ic('history')} Consultation records</h3><span class="sub">${list.length} records</span></div>
      ${list.length ? list.map((c) => `<details class="dx list-item" style="display:block"><summary style="display:flex;gap:12px;align-items:center">${avatar(c.patient_name)}<div style="flex:1;min-width:0"><b>${esc(c.patient_name)}</b><div class="sub">${fmtDate(c.appointment_date)} ${esc(c.appointment_time || '')} · ${esc(c.diagnosis).slice(0, 80)}</div></div><span class="qchip">${esc(c.token_code || '')}</span></summary>
        <div class="rx"><div><small>Diagnosis</small><pre>${esc(c.diagnosis)}</pre></div>${c.prescription ? `<div><small>Prescription</small><pre>${esc(c.prescription)}</pre></div>` : ''}${c.notes ? `<div><small>Notes</small><pre>${esc(c.notes)}</pre></div>` : ''}${c.follow_up_date ? `<div><small>Follow-up</small><br><b>${fmtDate(c.follow_up_date)}</b></div>` : ''}</div></details>`).join('') : empty('history', 'No consultations yet', 'Completed consultations with diagnosis and prescriptions are saved here.')}</div>`;
  },

  async loadAvail() { await refreshMe(); return S.doctor || {}; },
  viewAvail(p) {
    return `<form class="card" style="max-width:640px" onsubmit="return D.saveAvail(event)" novalidate><div class="card-h"><h3>${ic('settings')} Availability & consultation settings</h3></div><div id="av-err"></div>
      <label style="display:flex;gap:12px;align-items:center;margin-bottom:16px"><label class="switch"><input type="checkbox" name="is_available" ${p.is_available ? 'checked' : ''}><span></span></label><b>Accepting appointments</b></label>
      <div class="row"><div class="field"><label>Available from</label><input class="inp" type="time" name="avail_start" value="${esc(p.avail_start || '09:00')}"></div><div class="field"><label>Available until</label><input class="inp" type="time" name="avail_end" value="${esc(p.avail_end || '17:00')}"></div></div>
      <div class="row"><div class="field"><label>Consultation room</label><input class="inp" name="room" value="${esc(p.room || '')}"></div><div class="field"><label>Avg. minutes per patient</label><input class="inp" type="number" min="3" max="60" name="avg_consult_minutes" value="${esc(p.avg_consult_minutes)}"><span class="hint">Auto-learned from your actual consultation times.</span></div></div>
      <button class="btn primary" id="av-btn">${ic('check')} Save</button></form>`;
  },
  async saveAvail(e) {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    const btn = $('#av-btn'); busyBtn(btn, true);
    try { await api('doctors', { method: 'PUT', body: { is_available: !!f.is_available, avail_start: f.avail_start, avail_end: f.avail_end, room: f.room, avg_consult_minutes: f.avg_consult_minutes } }); toast('Availability saved', '', 'success'); await loadTab(false); }
    catch (x) { $('#av-err').innerHTML = `<div class="form-err">${esc(x.message)}</div>`; busyBtn(btn, false); }
    return false;
  },
};
</script>
<script>
/* ================= EMERGENCY CARDS (staff / doctor) ================= */
function emCard(e, role, selectable) {
  const b = [];
  const B = (label, fn, cls = '') => b.push(`<button class="btn sm ${cls}" onclick="event.stopPropagation();${fn}">${label}</button>`);
  if (can('emergency_manage')) {
    if (e.status === 'requested') B(`${ic('amb')} Assign ambulance`, `St.assign(${e.id})`, 'primary');
    if (['requested', 'accepted', 'en_route', 'transporting', 'arrived'].includes(e.status)) B(`${ic('bed')} ${e.hospital_prepared ? 'Change reserved bed' : 'Prepare bed / ICU'}`, `St.prepare(${e.id})`, e.hospital_prepared ? '' : 'purple');
    if (['arrived', 'triage'].includes(e.status)) B(`${ic('bed')} Allocate bed / ICU`, `St.admit(${e.id})`, 'green');
  }
  if (can('emergency_clinical') && e.status === 'arrived') B(`${ic('activity')} Triage`, `St.triage(${e.id})`, 'primary');
  if (can('emergency_clinical') && e.status === 'admitted') B(`${ic('heart')} Start treatment`, `St.emAct(${e.id},'treat',{},this)`, 'green');
  if (can('emergency_manage') && ['accepted', 'en_route', 'transporting', 'arrived', 'triage', 'admitted', 'treatment'].includes(e.status)) B('Close case', `St.closeEm(${e.id},this)`, 'ghost');
  if (can('emergency_manage') && ['requested', 'accepted', 'en_route'].includes(e.status)) B('Cancel', `St.cancelEm(${e.id},this)`, 'ghost danger');
  return `<div class="card em-card sev-${e.severity} ${S.emSel === e.id ? 'sel' : ''}" ${selectable ? `style="cursor:pointer" onclick="St.select(${e.id})"` : ''}>
    <div class="card-h" style="margin-bottom:6px"><h3>#${e.id} · ${esc(e.emergency_type)}</h3><div style="display:flex;gap:6px;flex-wrap:wrap">${chip(e.severity)}${chip(e.status)}${e.triage_level ? chip(e.triage_level) : ''}</div></div>
    <div><b>${esc(e.patient_name)}</b>${e.description ? `<span class="sub"> — ${esc(e.description)}</span>` : ''}</div>
    ${emMeta(e)}
    ${['accepted', 'en_route', 'transporting'].includes(e.status) ? `<div class="meta"><span style="font-weight:800;color:var(--blue-d)">${ic('clock')} ETA ${e.eta_minutes != null ? e.eta_minutes + ' min' : '—'} ${e.status === 'transporting' ? 'to hospital' : 'to pickup'}${e.distance_km != null ? ' · ' + e.distance_km + ' km' : ''}</span>${e.hospital_prepared ? `<span style="color:var(--green-d);font-weight:800">${ic('check')} Hospital prepared</span>` : `<span style="color:#B26A00;font-weight:800">${ic('alert')} Not prepared</span>`}</div>` : ''}
    ${b.length ? `<div class="actions">${b.join('')}</div>` : ''}</div>`;
}

/* ================= STAFF ================= */
const St = {
  async loadCommand() {
    await refreshCfg();
    const [a, em, ambs] = await Promise.all([api('analytics', { query: { date: localToday() } }), can('emergency_view') ? api('emergency', { query: { active: '1' } }) : [], api('ambulances')]);
    return { a, em, ambs };
  },
  viewCommand({ a, em, ambs }) {
    const r = a.resources || {}, sum = (types, k) => types.reduce((s, t) => s + ((r[t] || {})[k] || 0), 0);
    const beds = ['general_bed', 'emergency_bed', 'private_room'];
    const availAmb = (a.ambulances || {}).available || 0;
    const maxLoad = Math.max(1, ...a.doctors.map((d) => d.total_today));
    return `${hospitalMissingBanner()}
      <div class="grid g4 mb16">
        ${stat('users', 'blue', a.appointments_today, "Today's appointments")}${stat('ticket', 'purple', a.in_queue, 'Patients in queue')}
        ${stat('siren', 'red', a.emergencies_active, 'Active emergencies')}${stat('amb', 'green', `${availAmb}/${a.ambulances_total}`, 'Ambulances available')}
        ${stat('bed', 'blue', `${sum(beds, 'available')}/${sum(beds, 'total')}`, 'Beds & rooms free')}${stat('heart', 'red', `${sum(['icu_bed'], 'available')}/${sum(['icu_bed'], 'total')}`, 'ICU beds free')}
        ${stat('check', 'green', a.completed_today, 'Consultations done')}${stat('clock', 'amber', a.avg_response_min != null ? a.avg_response_min + ' min' : '—', 'Avg. ambulance response')}
      </div>
      <div class="split mb16">
        <div class="card"><div class="card-h"><h3>${ic('map')} Live fleet & emergency map</h3><span class="chip c-green"><span class="live-dot"></span> live</span></div>${mapSlot('fleet', true)}</div>
        <div class="card"><div class="card-h"><h3>${ic('siren')} Live emergencies</h3><button class="btn sm" onclick="go('emergencies')">Manage</button></div>
          ${em.length ? em.slice(0, 6).map((e) => `<div class="list-item" style="cursor:pointer" onclick="S.emSel=${e.id};go('emergencies')"><span class="avatar" style="background:${e.severity === 'critical' ? 'var(--red)' : e.severity === 'high' ? 'var(--amber)' : 'var(--blue)'}">${ic('siren')}</span><div style="flex:1;min-width:0"><b>#${e.id} · ${esc(e.emergency_type)}</b><div class="sub">${esc(e.patient_name)} · ${ago(e.created_at)}${['accepted', 'en_route', 'transporting'].includes(e.status) && e.eta_minutes != null ? ` · ETA ${e.eta_minutes}m` : ''}</div></div>${chip(e.status)}</div>`).join('') : empty('shield', 'No active emergencies', 'New requests trigger an instant alert.')}
        </div></div>
      <div class="grid g2">
        <div class="card"><div class="card-h"><h3>${ic('steth')} Doctor workload — today</h3><button class="btn sm" onclick="go('queues')">Queues</button></div>
          ${a.doctors.length ? a.doctors.map((d) => `<div class="barrow" style="grid-template-columns:150px 1fr 70px"><span class="lbl" title="${esc(d.full_name)}"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${d.is_available ? 'var(--green)' : '#c3cad6'};margin-right:6px"></span>${esc(d.full_name)}</span>
            <div class="bt"><span style="width:${(d.served / maxLoad) * 100}%;background:var(--green)"></span><span style="width:${(d.waiting / maxLoad) * 100}%;background:var(--blue)"></span></div><span class="v">${d.served}✓ ${d.waiting}⏳</span></div>`).join('') + `<p class="hint">Green: completed · Blue: waiting</p>` : empty('steth', 'No doctors registered yet')}
        </div>
        <div class="card"><div class="card-h"><h3>${ic('bed')} Resource occupancy</h3><button class="btn sm" onclick="go('resources')">Manage</button></div>
          ${Object.keys(r).length ? Object.entries(r).map(([t, v]) => `<div class="barrow"><span class="lbl">${RES_LABEL[t] || t}</span><div class="bt"><span style="width:${(v.occupied / v.total) * 100}%;background:var(--red)"></span><span style="width:${(v.reserved / v.total) * 100}%;background:var(--amber)"></span><span style="width:${(v.available / v.total) * 100}%;background:var(--green)"></span></div><span class="v">${v.available}/${v.total}</span></div>`).join('') + `<p class="hint">Red: occupied · Amber: reserved · Green: available</p>` : empty('bed', 'No resources added yet', 'Add beds, ICU units and rooms in Resources.', `<button class="btn primary sm" onclick="go('resources')">Add resources</button>`)}
        </div></div>`;
  },
  afterCommand({ em, ambs }) {
    const h = S.hospital, pts = [];
    if (h && hasLL(h.lat, h.lng)) pts.push({ kind: 'hosp', lat: +h.lat, lng: +h.lng, label: h.name });
    ambs.forEach((a) => { if (hasLL(a.current_lat, a.current_lng)) pts.push({ kind: 'amb', idle: a.status !== 'busy', lat: +a.current_lat, lng: +a.current_lng, label: `${a.vehicle_no} · ${(ST[a.status] || [a.status])[0]}`, sub: a.operator_name || '' }); });
    em.forEach((e) => { if (hasLL(e.pickup_lat, e.pickup_lng) && ['requested', 'accepted', 'en_route'].includes(e.status)) pts.push({ kind: 'pickup', lat: +e.pickup_lat, lng: +e.pickup_lng, label: `#${e.id} ${e.emergency_type}`, sub: e.patient_name }); });
    drawMap('fleet', pts, null, 'fleet', 'No GPS positions yet — set the hospital location in Settings');
  },

  /* emergencies */
  async loadEm() {
    await refreshCfg();
    const [list, ambs, res] = await Promise.all([api('emergency', { query: S.emFilter === 'active' ? { active: '1' } : {} }), can('emergency_manage') ? api('ambulances') : [], api('resources')]);
    S.cache = { ambs, res, list };
    return { list, ambs, res };
  },
  viewEm({ list }) {
    if (S.emSel && !list.some((e) => e.id === S.emSel)) S.emSel = null;
    if (!S.emSel && list.length) S.emSel = list[0].id;
    const sel = list.find((e) => e.id === S.emSel);
    return `${hospitalMissingBanner()}<div class="card-h"><div class="tabs2" style="margin:0;min-width:240px"><button class="${S.emFilter === 'active' ? 'on' : ''}" onclick="S.emFilter='active';loadTab(true)">Active</button><button class="${S.emFilter === 'all' ? 'on' : ''}" onclick="S.emFilter='all';loadTab(true)">All cases</button></div>
      ${can('emergency_manage') ? `<button class="btn danger" onclick="St.newEm()">${ic('plus')} Log emergency call</button>` : ''}</div>
      ${list.length ? `<div class="split"><div class="grid" style="align-content:start">${list.map((e) => emCard(e, S.user.role, true)).join('')}</div>
        <div style="position:sticky;top:90px;align-self:start"><div class="card">${sel ? `<div class="card-h"><h3>${ic('map')} Case #${sel.id} tracking</h3>${chip(sel.status)}</div>${etaBox(sel)}<div class="mt">${mapSlot('emmap')}</div><div class="mt">${emTimeline(sel)}</div>` : ''}</div></div></div>`
      : `<div class="card">${empty('shield', S.emFilter === 'active' ? 'No active emergencies' : 'No emergency cases yet', 'Emergency requests from patients and logged calls appear here instantly.')}</div>`}`;
  },
  afterEm({ list }) { const sel = list.find((e) => e.id === S.emSel); if (sel) drawEmergencyMap('emmap', sel); },
  select(id) { S.emSel = id; rerender(); },
  async emAct(id, action, extra = {}, btn) { return act(() => api('emergency', { method: 'PUT', body: { id, action, ...extra } }), btn, 'Emergency updated'); },
  resOptions(e) {
    const res = (S.cache?.res || []).filter((r) => r.status === 'available' || r.assigned_emergency_id === e.id);
    if (!res.length) return null;
    const groups = {};
    res.forEach((r) => (groups[r.resource_type] ||= []).push(r));
    return Object.entries(groups).map(([t, rs]) => `<optgroup label="${RES_LABEL[t] || t}">${rs.map((r) => `<option value="${r.id}" ${e.resource_id === r.id ? 'selected' : ''}>${esc(r.name)}${r.ward ? ' · ' + esc(r.ward) : ''}${r.assigned_emergency_id === e.id ? ' (reserved for this case)' : ''}</option>`).join('')}</optgroup>`).join('');
  },
  findEm(id) { return (S.cache?.list || []).find((e) => e.id === id) || (S.d.command?.em || []).find((e) => e.id === id); },
  assign(id) {
    const e = St.findEm(id);
    const avail = (S.cache?.ambs || []).filter((a) => a.status === 'available' && a.operator_id);
    if (!avail.length) return toast('No ambulance available', 'All ambulances are busy or offline.', 'warning');
    const withDist = avail.map((a) => ({ ...a, dist: hasLL(a.current_lat, a.current_lng) && hasLL(e?.pickup_lat, e?.pickup_lng) ? km(a.current_lat, a.current_lng, e.pickup_lat, e.pickup_lng) : null })).sort((x, y) => (x.dist ?? 1e9) - (y.dist ?? 1e9));
    openModal(`Assign ambulance · #${id}`, `<div class="field"><label>Available ambulance (nearest first)</label><select class="inp" name="ambulance_id" required>${withDist.map((a) => `<option value="${a.id}">${esc(a.vehicle_no)} · ${a.ambulance_type} · ${esc(a.operator_name || '')}${a.dist != null ? ` · ${a.dist.toFixed(1)} km away` : ''}</option>`).join('')}</select></div><p class="hint">The operator is notified instantly and live tracking begins.</p>`,
      async (f) => { await api('emergency', { method: 'PUT', body: { id, action: 'assign', ambulance_id: +f.ambulance_id } }); toast('Ambulance dispatched', '', 'success'); loadTab(false); }, 'Dispatch');
  },
  prepare(id) {
    const e = St.findEm(id); const opts = St.resOptions(e || {});
    if (!opts) return toast('No free resources', 'Add or release beds/ICU in Resources first.', 'warning');
    openModal(`Prepare hospital · #${id}`, `<div class="field"><label>Reserve bed / ICU / room</label><select class="inp" name="resource_id" required>${opts}</select></div><div class="field"><label>Preparation notes</label><input class="inp" name="notes" placeholder="e.g. Cardiology team on standby, crash cart ready"></div>`,
      async (f) => { await api('emergency', { method: 'PUT', body: { id, action: 'prepare', resource_id: +f.resource_id, notes: f.notes } }); toast('Resource reserved', '', 'success'); loadTab(false); }, 'Reserve');
  },
  admit(id) {
    const e = St.findEm(id); const opts = St.resOptions(e || {});
    if (!opts) return toast('No free resources', 'Add or release beds/ICU in Resources first.', 'warning');
    openModal(`Allocate bed / ICU · #${id}`, `<div class="field"><label>Allocate</label><select class="inp" name="resource_id" required>${opts}</select></div>`,
      async (f) => { await api('emergency', { method: 'PUT', body: { id, action: 'admit', resource_id: +f.resource_id } }); toast('Patient admitted', '', 'success'); loadTab(false); }, 'Allocate');
  },
  triage(id) {
    openModal(`Triage · #${id}`, `<div class="field"><label>Triage level</label><div class="grid g2">${['red', 'orange', 'yellow', 'green'].map((l, i) => `<label class="card" style="padding:12px;cursor:pointer;display:flex;gap:10px;align-items:center"><input type="radio" name="triage_level" value="${l}" ${i === 1 ? 'checked' : ''}>${chip(l)}</label>`).join('')}</div></div><div class="field"><label>Clinical notes</label><input class="inp" name="notes" placeholder="Vitals, observations"></div>`,
      async (f) => { await api('emergency', { method: 'PUT', body: { id, action: 'triage', triage_level: f.triage_level, notes: f.notes } }); toast('Triage recorded', '', 'success'); loadTab(false); }, 'Save triage');
  },
  async closeEm(id, btn) { if (!confirm('Close this case? Any reserved/occupied bed will be released.')) return; await St.emAct(id, 'close', {}, btn); },
  async cancelEm(id, btn) { if (!confirm('Cancel this emergency?')) return; await St.emAct(id, 'cancel', {}, btn); },
  newEm() {
    openModal('Log emergency call', `<div class="row"><div class="field"><label>Patient name *</label><input class="inp" name="patient_name" required></div><div class="field"><label>Caller phone *</label><input class="inp" name="contact_phone" required></div></div>
      <div class="row"><div class="field"><label>Emergency type *</label><select class="inp" name="emergency_type" required><option value="">Select…</option>${EM_TYPES.map((t) => `<option>${t}</option>`).join('')}</select></div><div class="field"><label>Severity</label><select class="inp" name="severity"><option value="critical">Critical</option><option value="high" selected>High</option><option value="moderate">Moderate</option></select></div></div>
      <div class="field"><label>Pickup address *</label><input class="inp" name="pickup_address" required placeholder="Full address / landmark"></div>
      <div class="row"><div class="field"><label>Latitude (optional)</label><input class="inp" name="pickup_lat" placeholder="12.9716"></div><div class="field"><label>Longitude (optional)</label><input class="inp" name="pickup_lng" placeholder="77.5946"></div></div>
      <div class="field"><label>Description</label><textarea class="inp" name="description"></textarea></div>`,
      async (f) => {
        if (!f.patient_name || !f.emergency_type || !f.pickup_address) throw new Error('Patient name, type and pickup address are required');
        await api('emergency', { method: 'POST', body: f }); toast('Emergency logged', 'Ambulances alerted.', 'emergency'); loadTab(false);
      }, 'Log & alert', true);
  },

  /* appointments */
  async loadAppts() {
    S.sf.date ||= localToday();
    const [list, doctors] = await Promise.all([api('appointments', { query: S.sf }), api('doctors', { query: { date: S.sf.date } })]);
    return { list, doctors };
  },
  viewAppts({ list, doctors }) {
    const sel = (name, opts) => `<select class="inp" style="width:auto" onchange="S.sf.${name}=this.value;loadTab(true)">${opts}</select>`;
    return `<div class="card"><div class="card-h"><h3>${ic('cal')} Appointments</h3><div style="display:flex;gap:8px;flex-wrap:wrap">
      <input class="inp" type="date" style="width:auto" value="${esc(S.sf.date || '')}" onchange="S.sf.date=this.value;this.defaultValue=this.value;loadTab(true)">
      ${sel('doctor_id', `<option value="">All doctors</option>${doctors.map((d) => `<option value="${d.id}" ${String(S.sf.doctor_id) === String(d.id) ? 'selected' : ''}>${esc(d.full_name)}</option>`).join('')}`)}
      ${sel('status', `<option value="">All statuses</option>${['waiting', 'called', 'in_consultation', 'completed', 'cancelled', 'no_show'].map((s) => `<option value="${s}" ${S.sf.status === s ? 'selected' : ''}>${ST[s][0]}</option>`).join('')}`)}</div></div>
      ${list.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Token</th><th>Patient</th><th>Doctor</th><th>Date</th><th>Reason</th><th>Status</th><th></th></tr></thead><tbody>${list.map((a) => `<tr>
        <td><span class="qchip">${esc(a.token_code || '—')}</span></td><td><b>${esc(a.patient_name)}</b><div class="sub">${esc(a.patient_phone)}</div></td><td>${esc(a.doctor_name)}<div class="sub">${esc(a.department)}</div></td>
        <td>${fmtDate(a.appointment_date)}<div class="sub">${esc(a.appointment_time || '')}</div></td><td class="sub">${esc(a.reason || '—')}</td><td>${chip(a.status)}</td>
        <td style="white-space:nowrap">${a.status === 'waiting' ? `<button class="btn sm ghost danger" onclick="St.apptAct(${a.id},'cancel',this)">Cancel</button> ` : ''}${['waiting', 'called'].includes(a.status) ? `<button class="btn sm ghost" onclick="St.apptAct(${a.id},'no_show',this)">No-show</button>` : ''}</td></tr>`).join('')}</tbody></table></div>` : empty('cal', 'No appointments match these filters')}</div>`;
  },
  async apptAct(id, action, btn) { if (action === 'cancel' && !confirm('Cancel this appointment?')) return; await act(() => api('appointments', { method: 'PUT', body: { id, action } }), btn, 'Appointment updated'); },

  /* queues */
  async loadQueues() { return api('queue', { query: { date: localToday() } }); },
  viewQueues({ doctors }) {
    if (!doctors.length) return `<div class="card">${empty('steth', 'No doctors registered yet', 'Doctor queues appear here once doctors register.')}</div>`;
    return `<div class="grid g3">${doctors.map((d) => { const w = d.tokens.filter((t) => t.status === 'waiting'); return `<div class="card rise">
      <div style="display:flex;gap:12px;align-items:center">${avatar(d.full_name, 44)}<div style="flex:1;min-width:0"><h3>${esc(d.full_name)}</h3><div class="sub">${esc(d.department)}${d.room ? ' · Room ' + esc(d.room) : ''}</div></div>${d.is_available ? chip('available') : chip('offline', 'Away')}</div>
      <div style="display:flex;justify-content:space-between;align-items:flex-end;margin:16px 0 12px"><div><div class="sub" style="font-weight:800;font-size:11px;letter-spacing:.08em">NOW SERVING</div><div class="now-serving" style="font-size:38px">${esc(d.current_token || '—')}</div></div>
        <div style="text-align:right"><b class="display" style="font-size:22px">${w.length}</b><div class="sub">waiting · ~${mins(d.est_wait)}</div></div></div>
      <div class="qchips">${d.tokens.map((t) => `<span class="qchip ${t.status}">${esc(t.token_code)}</span>`).join('') || '<span class="sub">No tokens today</span>'}</div>
      <div class="actions"><button class="btn sm primary" ${w.length && !d.current_token && can('queues') ? '' : 'disabled'} onclick="St.callNext(${d.id}, this)">${ic('bell')} Call next</button></div></div>`; }).join('')}</div>`;
  },
  async callNext(doctor_id, btn) { await act(() => api('queue/next', { method: 'POST', body: { doctor_id, date: localToday() } }), btn, 'Next patient called'); },

  /* resources */
  async loadRes() { return api('resources'); },
  viewRes(list) {
    const types = Object.keys(RES_LABEL);
    const by = {}; list.forEach((r) => (by[r.resource_type] ||= []).push(r));

  catch (e) { toast('Location not sent', e.message, 'error'); }
}

          ${!sharing && ['accepted', 'en_route', 'transporting'].includes(e.status) ? `<div class="banner-warn mt" style="margin-bottom:0">${ic('radio')}<span>Share your live location so the patient and hospital can track you.</span></div>` : ''}</div></div>`;

    return `${ambCard}${trip}
      <div class="card"><div class="card-h"><h3>${ic('siren')} Emergency requests</h3><span class="chip c-red"><span class="live-dot" style="background:var(--red)"></span> ${requests.length} open</span></div>
        ${requests.length ? `<div class="grid g2">${requests.map((e) => { const dist = hasLoc && hasLL(e.pickup_lat, e.pickup_lng) ? km(amb.current_lat, amb.current_lng, e.pickup_lat, e.pickup_lng) : null; return `<div class="card em-card sev-${e.severity}" style="box-shadow:none">
          <div class="card-h" style="margin-bottom:6px"><h3>#${e.id} · ${esc(e.emergency_type)}</h3>${chip(e.severity)}</div><b>${esc(e.patient_name)}</b>${emMeta(e)}
          ${dist != null ? `<div class="meta"><span style="font-weight:800;color:var(--blue-d)">${ic('nav')} ${dist.toFixed(1)} km away · ~${Math.max(1, Math.round((dist * 1.3) / 32 * 60))} min</span></div>` : ''}
          <div class="actions"><button class="btn danger" ${act_ || amb.status !== 'available' ? 'disabled' : ''} onclick="O.accept(${e.id}, this)">${ic('check')} Accept emergency</button></div></div>`; }).join('')}</div>
          ${act_ ? '<p class="hint mt">Complete your active trip to accept new requests.</p>' : amb.status !== 'available' ? '<p class="hint mt">Go available to accept requests.</p>' : ''}`
        : empty('shield', 'No open requests', amb.status === 'available' ? 'You will be alerted instantly when a new emergency comes in.' : 'Go available to receive emergency requests.')}</div>`;
  },
  afterDispatch({ list }) { const a = O.active(list); if (a) drawEmergencyMap('opmap', a); },
  async register(e) {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    const btn = $('#amb-btn'); busyBtn(btn, true);
    try { await api('ambulances', { method: 'POST', body: f }); toast('Ambulance registered', 'You are now available for emergencies.', 'success'); await loadTab(false); }
    catch (x) { $('#amb-err').innerHTML = `<div class="form-err">${esc(x.message)}</div>`; busyBtn(btn, false); }
    return false;
  },
  async setStatus(status, btn) { await act(() => api('ambulances', { method: 'PUT', body: { action: 'status', status } }), btn, status === 'available' ? 'You are available' : 'You are offline'); },
  async accept(id, btn) {
    const r = await act(() => api('emergency', { method: 'PUT', body: { id, action: 'accept' } }), btn, 'Emergency accepted', 'Start the trip and share your live location.');
    if (r && S.tracking == null) O.toggleShare();
  },
  async step(id, action, btn) {
    const labels = { start: 'Trip started', pickup: 'Patient onboard — heading to hospital', arrive: 'Arrival recorded — hospital notified', complete_trip: 'Trip completed — you are available again' };
    if (action === 'arrive' || action === 'complete_trip') { }
    if (action === 'complete_trip') stopTracking();
    await act(() => api('emergency', { method: 'PUT', body: { id, action } }), btn, labels[action]);
  },
  toggleShare() {
    if (S.tracking != null) { stopTracking(); toast('Location sharing stopped', '', 'info'); return rerender(); }
    if (!navigator.geolocation) return toast('GPS unavailable', 'This device does not support geolocation.', 'error');
    S.tracking = navigator.geolocation.watchPosition((p) => {
      const now = Date.now(); if (now - S.lastSent < 4000) return; S.lastSent = now;
      sendLocation(p.coords.latitude, p.coords.longitude, p.coords.speed != null ? p.coords.speed * 3.6 : null, p.coords.heading);
    }, (err) => { toast('GPS error', err.message, 'error'); stopTracking(); rerender(); }, { enableHighAccuracy: true, maximumAge: 3000, timeout: 20000 });
    toast('Sharing live location', 'Patient and hospital can now track you.', 'success');
    rerender();
  },

  viewHistory(list) {
    const mine = list.filter((e) => e.operator_id === S.profile.id);

  },
};

/* ================= DIGITAL TWIN (doctor) — synthetic data prototype ================= */
const fmtHM = (iso) => new Date(iso).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
function tChart({ t, series, lo, hi, bands = [], refs = [], future = null, bars = false, h = 180, unit = '' }) {
  const W = 640, H = h, pl = 40, pr = 14, pt = 12, pb = 24, extra = future ? 8 : 0, n = t.length + extra;
  const X = (i) => pl + (i / Math.max(1, n - 1)) * (W - pl - pr), Y = (v) => pt + (1 - (Math.min(hi, Math.max(lo, v)) - lo) / (hi - lo)) * (H - pt - pb);
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = lo + (hi - lo) * k / 4; g += `<line x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#E6ECF5"/><text x="${pl - 6}" y="${Y(v) + 4}" font-size="10" text-anchor="end" fill="#7A879E">${Math.round(v)}</text>`; }
  for (const b of bands) g += `<rect x="${pl}" width="${W - pl - pr}" y="${Y(b.hi)}" height="${Math.max(0, Y(b.lo) - Y(b.hi))}" fill="${b.color}"/>`;
  for (const r of refs) g += `<line x1="${pl}" x2="${W - pr}" y1="${Y(r.v)}" y2="${Y(r.v)}" stroke="${r.color}" stroke-dasharray="4 4"/><text x="${W - pr}" y="${Y(r.v) - 3}" font-size="10" text-anchor="end" fill="${r.color}">${esc(r.label)}</text>`;
  for (let i = 0; i < t.length; i += 16) g += `<text x="${X(i)}" y="${H - 6}" font-size="10" text-anchor="middle" fill="#7A879E">${fmtHM(t[i])}</text>`;
  for (const sr of series) {
    if (bars) { const bw = Math.max(1, (W - pl - pr) / n - 1); sr.v.forEach((v, i) => { g += `<rect x="${X(i) - bw / 2}" y="${Y(v)}" width="${bw}" height="${Math.max(0, Y(lo) - Y(v))}" fill="${sr.color}" rx="1"/>`; }); }
    else g += `<polyline fill="none" stroke="${sr.color}" stroke-width="2.2" stroke-linejoin="round" points="${sr.v.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ')}"/>`;
  }
  if (future) {
    const i0 = t.length - 1, v0 = series[0].v[i0], i1 = n - 1;
    g += `<line x1="${X(i0)}" y1="${Y(v0)}" x2="${X(i1)}" y2="${Y(future.v)}" stroke="${future.color}" stroke-width="2.2" stroke-dasharray="5 4"/><circle cx="${X(i1)}" cy="${Y(future.v)}" r="5" fill="#fff" stroke="${future.color}" stroke-width="3"/><text x="${X(i1)}" y="${Y(future.v) - 9}" font-size="11" font-weight="800" text-anchor="end" fill="${future.color}">${esc(future.label)}</text><line x1="${X(i0)}" x2="${X(i0)}" y1="${pt}" y2="${H - pb}" stroke="#B8C4D8" stroke-dasharray="2 3"/><text x="${X(i0) - 3}" y="${pt + 9}" font-size="10" text-anchor="end" fill="#7A879E">now</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="${esc(unit)} chart">${g}</svg>`;
}
const RISK_CHIP = { High: 'red', Moderate: 'amber', Low: 'green' };
const twinLiveHtml = (s) => `<span class="live-dot"></span> live sample ${fmtHM(s.t)}: <b>${s.glucose} mg/dL</b> · HR ${s.heart_rate} · HRV ${s.hrv} ms · ${s.steps_5min} steps/5 min${s.asleep ? ' · asleep' : ''} → ${Math.round(s.probability * 100)}% spike risk`;
const riskChip = (r) => `<span class="chip c-${RISK_CHIP[r] || 'gray'}"><span class="dot"></span>${esc(r)} risk</span>`;
const DT = {
  async load() {
    const list = await api('twin/patients');

    const [detail, model] = await Promise.all([S.twinSel ? api('twin/patient', { query: { patient_id: S.twinSel } }) : null, S.twinModel ? S.twinModel : api('twin/model')]);

      <span class="sub">Twin <b class="mono">${esc(tw.twin_id)}</b> · last visit ${fmtDate(detail.patient.last_visit)} · updated ${fmtHM(tw.generated_at)}</span>
      <span id="twin-live" class="sub">${(() => { const s = ((S.twinLive && S.twinLive.samples) || []).find((x) => x.patient_id === S.twinSel); return s ? twinLiveHtml(s) : (S.cfg.realtime ? 'waiting for live sample…' : 'auto-refresh every minute'); })()}</span>
      <span class="chip c-purple" style="margin-left:auto">Synthetic data</span></div>`;
    const arrow = st.change_30min > 4 ? '↑' : st.change_30min < -4 ? '↓' : '→';

      <div class="bt"><span style="width:${(Math.abs(f.impact) / maxImp) * 100}%;background:${f.impact >= 0 ? 'var(--red)' : 'var(--green)'}"></span></div><span class="v" style="color:${f.impact >= 0 ? '#C52B2B' : 'var(--green-d)'}">${f.impact >= 0 ? '+' : '−'}${Math.abs(f.impact).toFixed(2)}</span></div>`).join('');
    const ehr = tw.ehr;
    return `${proto}${sel}
      <div class="grid g4 mb16">
        ${stat('activity', 'blue', `${st.glucose} ${arrow}`, `Current glucose (mg/dL) · ${st.change_30min >= 0 ? '+' : ''}${st.change_30min} in 30 min`)}
        ${stat('clock', 'purple', pr.predicted_glucose_2h, `Predicted glucose at ${fmtHM(tw.prediction_for)} (mg/dL)`)}
        ${stat('zap', pr.risk === 'High' ? 'red' : pr.risk === 'Moderate' ? 'amber' : 'green', Math.round(pr.probability * 100) + '%', 'Spike probability (next 2 h)')}
        <div class="stat rise"><i class="i-${RISK_CHIP[pr.risk] === 'green' ? 'green' : RISK_CHIP[pr.risk] === 'amber' ? 'amber' : 'red'}">${ic('heart')}</i><div><b style="font-size:20px">${riskChip(pr.risk)}</b><span>Prediction made ${fmtHM(tw.generated_at)} for ${fmtHM(tw.prediction_for)}</span></div></div>
      </div>
      <div class="split mb16">
        <div class="card"><div class="card-h"><h3>${ic('activity')} Glucose — last 24 h + 2-h prediction</h3><span class="chip c-green"><span class="live-dot"></span> synthetic CGM stream</span></div>
          ${tChart({ t: sr.t, series: [{ v: sr.glucose, color: '#1E6BFF' }], lo: 50, hi: 320, bands: [{ lo: 70, hi: 180, color: 'rgba(16,185,129,.08)' }], refs: [{ v: 180, label: '180', color: '#EF4444' }, { v: 70, label: '70', color: '#F59E0B' }], future: { v: pr.predicted_glucose_2h, color: '#7C3AED', label: `${pr.predicted_glucose_2h} @ +2h` }, unit: 'glucose' })}
          <p class="hint">Spike definition: ${esc(tw.spike_definition)}.</p></div>
        <div class="card"><div class="card-h"><h3>${ic('list')} Why this prediction</h3><span class="sub">log-odds contribution</span></div>
          ${factors}
          <p class="hint">Red raises, green lowers spike risk. Model test AUC on held-out synthetic individuals: <b>${tw.model.test_auc}</b> (Brier ${tw.model.brier}).</p>
          <div class="rx" style="margin-top:10px"><small>Back-test (prediction made 2 h ago)</small><div>At ${fmtHM(bt.made_at)} the twin predicted <b>${bt.predicted_glucose} mg/dL</b> (${Math.round(bt.probability * 100)}% spike, ${esc(bt.risk)}). Simulated value now: <b>${bt.actual_glucose} mg/dL</b> · spike occurred: <b>${bt.actual_spike ? 'yes' : 'no'}</b>.</div></div></div>
      </div>
      <div class="grid g2 mb16">
        <div class="card"><div class="card-h"><h3>${ic('heart')} Heart rate (bpm)</h3><span class="sub">now ${st.heart_rate} bpm</span></div>${tChart({ t: sr.t, series: [{ v: sr.heart_rate, color: '#EF4444' }], lo: 40, hi: 160, unit: 'heart rate' })}</div>
        <div class="card"><div class="card-h"><h3>${ic('activity')} Heart-rate variability (RMSSD, ms)</h3><span class="sub">1-h mean ${st.hrv_rmssd} ms</span></div>${tChart({ t: sr.t, series: [{ v: sr.hrv, color: '#7C3AED' }], lo: 0, hi: Math.max(80, ...sr.hrv), unit: 'HRV' })}</div>
        <div class="card"><div class="card-h"><h3>${ic('zap')} Activity — steps per 15 min</h3><span class="sub">last hour ${st.steps_last_hour}</span></div>${tChart({ t: sr.t, series: [{ v: sr.steps, color: '#10B981' }], lo: 0, hi: Math.max(500, ...sr.steps), bars: true, unit: 'steps' })}</div>
        <div class="card"><div class="card-h"><h3>${ic('clock')} Sleep — last 7 nights (h)</h3><span class="sub">last night ${st.sleep_last_night} h</span></div>

          <div class="rx"><div><small>Diagnoses</small><div>${ehr.diagnoses.map(esc).join(' · ')}</div></div><div><small>Medications</small><div>${ehr.medications.map(esc).join(' · ') || '—'}</div></div></div>
          <div class="tbl-wrap mt"><table class="tbl"><thead><tr><th>Lab date</th><th>HbA1c</th><th>Fasting glucose</th></tr></thead><tbody>${ehr.lab_history.map((l) => `<tr><td>${fmtDate(l.date)}</td><td>${l.hba1c}%</td><td>${l.fasting_glucose} mg/dL</td></tr>`).join('')}</tbody></table></div></div>

      </div>
      ${DT.modelCard(model)}`;
  },
  modelCard(m) {
    if (!m) return '';
