<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Q-NIRVANA – Smart Digital Hospital Management System</title>
<meta name="description" content="Q-NIRVANA: smart digital tokens, live queues, doctor consultations, hospital command centre and GPS ambulance tracking." />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%231E6BFF'/%3E%3Cstop offset='.55' stop-color='%237C3AED'/%3E%3Cstop offset='1' stop-color='%2310B981'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M32 14c5 6 7 12 7 18s-3 12-7 16c-4-4-7-10-7-16s2-12 7-18z' fill='%23fff' opacity='.95'/%3E%3Cpath d='M14 30c7 0 13 3 17 9-2 5-6 8-11 8-5-3-7-10-6-17zM50 30c-7 0-13 3-17 9 2 5 6 8 11 8 5-3 7-10 6-17z' fill='%23fff' opacity='.7'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
:root{
  --blue:#1E6BFF;--blue-d:#1552C9;--blue-l:#EAF1FF;
  --green:#10B981;--green-d:#0A8A5F;--green-l:#E7F8F1;
  --purple:#7C3AED;--purple-d:#6429D6;--purple-l:#F1EAFE;
  --red:#EF4444;--red-l:#FDECEC;--amber:#F59E0B;--amber-l:#FEF5E6;
  --ink:#0B1A3A;--ink2:#42506B;--muted:#7A879E;--line:#E6ECF5;--bg:#F5F8FD;--card:#fff;
  --grad:linear-gradient(120deg,#1E6BFF 0%,#7C3AED 55%,#10B981 100%);
  --shadow:0 1px 2px rgba(11,26,58,.04),0 8px 24px -12px rgba(11,26,58,.12);
  --r:18px;
}
html{scroll-behavior:smooth}
body{font-family:'Nunito Sans',system-ui,sans-serif;color:var(--ink);background:#fff;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.display{font-family:'Sora',sans-serif;letter-spacing:-.02em}
.mono{font-family:'JetBrains Mono',monospace}
a{color:var(--blue);text-decoration:none}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
.hidden{display:none!important}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:700;font-size:14px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:#cfd9ea;transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 8px 18px -8px rgba(30,107,255,.6)}
.btn.primary:hover{background:var(--blue-d)}
.btn.green{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 8px 18px -8px rgba(16,185,129,.6)}
.btn.purple{background:var(--purple);border-color:var(--purple);color:#fff;box-shadow:0 8px 18px -8px rgba(124,58,237,.55)}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent}
.btn.ghost.danger{color:var(--red);background:#fff;border-color:#f5c6c6}
.btn.grad{background:var(--grad);border:0;color:#fff;box-shadow:0 10px 24px -10px rgba(124,58,237,.6)}
.btn.lg{padding:14px 22px;font-size:15px;border-radius:14px}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn svg{width:17px;height:17px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.c-blue{background:var(--blue-l);color:var(--blue-d)}.c-green{background:var(--green-l);color:var(--green-d)}
.c-purple{background:var(--purple-l);color:var(--purple-d)}.c-red{background:var(--red-l);color:#C52B2B}
.c-amber{background:var(--amber-l);color:#B26A00}.c-gray{background:#EEF2F7;color:#5B6780}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:700;color:var(--ink2)}
.inp{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none;transition:.15s}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(30,107,255,.12)}
textarea.inp{resize:vertical;min-height:84px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.form-err{background:var(--red-l);color:#B42323;padding:10px 12px;border-radius:12px;font-size:13px;font-weight:600;margin-bottom:12px}
.hint{font-size:12px;color:var(--muted)}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.card h3{font-size:16px;margin-bottom:4px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h h3{margin:0;display:flex;align-items:center;gap:8px}
.card-h h3 svg{width:18px;height:18px;color:var(--blue)}
.sub{color:var(--muted);font-size:13px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty .ico{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;margin:0 auto 12px;background:var(--blue-l);color:var(--blue)}
.empty .ico svg{width:26px;height:26px}
.empty h4{color:var(--ink);font-size:16px;margin-bottom:4px}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.list-item:last-child{border-bottom:0}
.avatar{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#fff;flex-shrink:0;font-family:'Sora'}
.kv{display:flex;flex-direction:column}
.kv small{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.kv b{font-size:15px}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl-wrap{overflow-x:auto;margin:0 -20px;padding:0 20px}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--blue-l);border-top-color:var(--blue);animation:spin .8s linear infinite}
.loader{display:flex;flex-direction:column;align-items:center;gap:12px;padding:60px;color:var(--muted)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.5)}70%{box-shadow:0 0 0 10px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
@keyframes pulseR{0%{box-shadow:0 0 0 0 rgba(239,68,68,.55)}70%{box-shadow:0 0 0 22px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rise{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 1.8s infinite;display:inline-block}

/* ---------- landing ---------- */
.nav{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:'Sora';font-weight:800;font-size:19px;color:var(--ink)}
.brand small{display:block;font-family:'Nunito Sans';font-weight:700;font-size:10.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:-2px}
.nav-links{display:flex;gap:22px;font-weight:700;font-size:14px}
.nav-links a{color:var(--ink2)}
.hero{position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-30% -10% auto auto;width:720px;height:720px;background:radial-gradient(circle,rgba(124,58,237,.12),transparent 60%);pointer-events:none}
.hero::after{content:"";position:absolute;left:-200px;bottom:-260px;width:620px;height:620px;background:radial-gradient(circle,rgba(16,185,129,.12),transparent 60%);pointer-events:none}
.hero-in{max-width:1200px;margin:0 auto;padding:64px 20px 56px;display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;position:relative;z-index:1}
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--blue-l);color:var(--blue-d);font-weight:800;font-size:12px;letter-spacing:.04em}
.hero h1{font-size:clamp(44px,7vw,84px);line-height:.95;font-weight:800;margin:18px 0 10px}
.hero h2{font-size:clamp(18px,2.2vw,24px);font-weight:600;color:var(--ink2);margin-bottom:16px}
.hero p.lead{font-size:17px;color:var(--ink2);max-width:540px;margin-bottom:26px}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap}
.pillars{display:flex;gap:18px;margin-top:30px;flex-wrap:wrap}
.pillar{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;color:var(--ink2)}
.pillar i{width:30px;height:30px;border-radius:10px;display:grid;place-items:center}
.pillar i svg{width:16px;height:16px}
.orbit{position:relative;aspect-ratio:1;max-width:500px;margin:0 auto;width:100%}
.orbit .ring{position:absolute;inset:8%;border:2px dashed #d9e3f3;border-radius:50%}
.orbit .ring.r2{inset:24%;border-style:solid;border-color:#eef2fa}
.orbit .core{position:absolute;inset:34%;border-radius:36%;background:var(--grad);display:grid;place-items:center;box-shadow:0 30px 60px -20px rgba(124,58,237,.55)}
.orbit .core svg{width:58%;height:58%}
.node{position:absolute;width:128px;padding:12px;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);text-align:center;transform:translate(-50%,-50%)}
.node i{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;margin:0 auto 6px;color:#fff}
.node i svg{width:20px;height:20px}
.node b{font-size:13px;display:block}
.node span{font-size:11px;color:var(--muted)}
.section{max-width:1200px;margin:0 auto;padding:64px 20px}
.section-h{text-align:center;max-width:680px;margin:0 auto 36px}
.section-h h2{font-size:clamp(28px,3.4vw,40px);font-weight:800;margin:10px 0}
.section-h p{color:var(--ink2)}
.role-card{border-radius:22px;padding:24px;border:1px solid var(--line);background:#fff;position:relative;overflow:hidden;transition:.2s}
.role-card:hover{transform:translateY(-4px);box-shadow:0 24px 40px -24px rgba(11,26,58,.25)}
.role-card .ri{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff;margin-bottom:14px}
.role-card .ri svg{width:24px;height:24px}
.role-card h3{font-size:19px;margin-bottom:6px}
.role-card ul{list-style:none;margin-top:12px;display:grid;gap:7px}
.role-card li{display:flex;gap:8px;font-size:14px;color:var(--ink2)}
.role-card li svg{width:16px;height:16px;flex-shrink:0;margin-top:3px}
.role-card .bar{position:absolute;left:0;top:0;right:0;height:4px}
.flow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.flow .st{padding:10px 14px;border-radius:14px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow)}
.flow .st b{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:12px;font-family:'Sora'}
.flow .ar{color:#b8c4d8}
.flow-band{background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.foot{border-top:1px solid var(--line);padding:28px 20px;text-align:center;color:var(--muted);font-size:13px}
.foot a{font-weight:700}

/* ---------- auth modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(11,26,58,.45);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;overflow-y:auto;animation:rise .2s both}
.modal{background:#fff;border-radius:22px;width:100%;max-width:520px;box-shadow:0 40px 80px -30px rgba(11,26,58,.5);overflow:hidden}
.modal.wide{max-width:640px}
.mh{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.mh h3{font-size:18px}
.mh .x{border:0;background:var(--bg);width:34px;height:34px;border-radius:10px;font-size:20px;line-height:1;color:var(--ink2)}
.mb{padding:20px 22px}
.mf{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--line);background:#fbfcfe}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px 6px;font-weight:700;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--ink2)}
.seg button svg{width:20px;height:20px}
.seg button.on{border-color:var(--blue);background:var(--blue-l);color:var(--blue-d)}
.tabs2{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);padding:4px;border-radius:14px;margin-bottom:18px}
.tabs2 button{border:0;background:transparent;padding:9px;border-radius:11px;font-weight:800;color:var(--muted)}
.tabs2 button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}

/* ---------- dashboard shell ---------- */
.dash{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh;background:var(--bg)}
.side{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px}
.side .brand{padding:4px 8px 18px}
.role-badge{margin:0 8px 16px;padding:10px 12px;border-radius:14px;color:#fff;display:flex;align-items:center;gap:10px;font-weight:800;font-size:13px}
.role-badge svg{width:18px;height:18px}
.navi{display:flex;flex-direction:column;gap:3px;flex:1;overflow-y:auto}
.navi button{display:flex;align-items:center;gap:12px;padding:11px 12px;border:0;background:transparent;border-radius:12px;font-weight:700;color:var(--ink2);text-align:left;font-size:14px;position:relative}
.navi button svg{width:19px;height:19px}
.navi button:hover{background:var(--bg)}
.navi button.on{background:var(--blue-l);color:var(--blue-d)}
.navi button .cnt{margin-left:auto;background:var(--red);color:#fff;font-size:11px;padding:1px 7px;border-radius:999px}
.me-card{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--bg);margin-top:10px}
.me-card .n{font-weight:800;font-size:14px;line-height:1.2}
.me-card .e{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px}
.me-card button{margin-left:auto;border:0;background:#fff;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--ink2)}
.me-card button svg{width:17px;height:17px}
.topbar{position:sticky;top:0;z-index:30;background:rgba(245,248,253,.9);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;padding:16px 26px;gap:12px}
.topbar h1{font-size:22px;font-weight:800}
.topbar .tb-r{display:flex;align-items:center;gap:10px}
.live-pill{display:flex;align-items:center;gap:8px;padding:7px 12px;background:#fff;border:1px solid var(--line);border-radius:999px;font-size:12px;font-weight:800;color:var(--ink2)}
.bell{position:relative;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--ink2)}
.bell svg{width:19px;height:19px}
.bell .cnt{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg)}
.m-logout{display:none}
main#main{padding:4px 26px 40px;max-width:1400px;width:100%}
.mnav{display:none}
.npanel{position:fixed;top:70px;right:20px;width:380px;max-width:calc(100vw - 24px);max-height:70vh;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 60px -20px rgba(11,26,58,.35);z-index:90;display:flex;flex-direction:column;overflow:hidden;animation:rise .2s both}
.npanel .nh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.npanel .nl{overflow-y:auto}
.notif{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.notif.unread{background:#F7FAFF}
.notif .ni{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex-shrink:0}
.notif .ni svg{width:16px;height:16px}
.notif b{font-size:14px;display:block;line-height:1.3}
.notif p{font-size:13px;color:var(--ink2);margin:2px 0}
.notif time{font-size:11px;color:var(--muted)}

/* toasts */
#toasts{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:10px;max-width:min(380px,calc(100vw - 36px))}
.toast{background:#fff;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:14px;padding:12px 14px;box-shadow:0 20px 40px -18px rgba(11,26,58,.35);animation:rise .25s both;font-size:14px}
.toast b{display:block}
.toast p{color:var(--ink2);font-size:13px}
.toast.success{border-left-color:var(--green)}.toast.error{border-left-color:var(--red)}.toast.emergency{border-left-color:var(--red)}.toast.call{border-left-color:var(--purple)}.toast.warning{border-left-color:var(--amber)}

/* stats */
.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:center}
.stat i{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex-shrink:0}
.stat i svg{width:22px;height:22px}
.stat b{font-family:'Sora';font-size:24px;line-height:1.1;display:block}
.stat span{font-size:12.5px;color:var(--muted);font-weight:700}
.i-blue{background:var(--blue-l);color:var(--blue)}.i-green{background:var(--green-l);color:var(--green)}.i-purple{background:var(--purple-l);color:var(--purple)}.i-red{background:var(--red-l);color:var(--red)}.i-amber{background:var(--amber-l);color:var(--amber)}

/* token */
.token-card{border-radius:24px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.token-top{background:var(--grad);color:#fff;padding:20px 22px;position:relative;overflow:hidden}
.token-top::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.1)}
.token-top .doc{font-weight:700;font-size:14px;opacity:.95;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.token-nums{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;position:relative;z-index:1}
.token-nums small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.85;font-weight:800}
.token-nums .big{font-family:'JetBrains Mono';font-weight:800;font-size:52px;line-height:1}
.token-nums .mid{font-family:'JetBrains Mono';font-weight:800;font-size:34px;line-height:1.3;opacity:.95}
.token-body{padding:18px 22px}
.tstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.tstats div{background:var(--bg);border-radius:14px;padding:10px 12px}
.tstats small{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.tstats b{display:block;font-family:'Sora';font-size:20px}
.prog{height:9px;background:var(--bg);border-radius:99px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .6s}
.turn-banner{background:linear-gradient(90deg,#10B981,#0EA5E9);color:#fff;padding:12px 16px;border-radius:14px;font-weight:800;display:flex;align-items:center;gap:10px;margin-bottom:14px;animation:pulse 1.6s infinite}
.turn-banner svg{width:20px;height:20px}
.steps{display:flex;gap:4px;margin-top:14px}
.steps div{flex:1;text-align:center;font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.steps div::before{content:"";display:block;height:5px;border-radius:9px;background:var(--line);margin-bottom:6px}
.steps div.done{color:var(--green-d)}.steps div.done::before{background:var(--green)}
.steps div.cur{color:var(--blue-d)}.steps div.cur::before{background:var(--blue)}

/* stepper */
.stepper{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.stepper div{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;color:var(--muted);padding:8px 12px;border-radius:12px;background:#fff;border:1px solid var(--line)}
.stepper div b{width:22px;height:22px;border-radius:7px;background:var(--bg);display:grid;place-items:center;font-size:12px}
.stepper div.on{color:var(--blue-d);border-color:#bcd3ff}.stepper div.on b{background:var(--blue);color:#fff}
.stepper div.done{color:var(--green-d)}.stepper div.done b{background:var(--green);color:#fff}
.pick{cursor:pointer;transition:.15s;text-align:left;width:100%;font:inherit;color:inherit}
.pick:hover{border-color:#bcd3ff;transform:translateY(-2px)}
.pick:disabled{opacity:.55;cursor:not-allowed;transform:none}
.dept-ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;margin-bottom:10px}
.dept-ico svg{width:22px;height:22px}

/* emergency */
.sos{display:flex;flex-direction:column;align-items:center;text-align:center;padding:22px 10px 10px}
.sos-btn{width:130px;height:130px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff7a7a,#E11D48);color:#fff;display:grid;place-items:center;border:6px solid #fff;box-shadow:0 20px 40px -12px rgba(225,29,72,.6);animation:pulseR 1.8s infinite;font-family:'Sora';font-weight:800;font-size:26px;margin-bottom:12px}
.sev{display:flex;gap:8px;flex-wrap:wrap}
.sev label{flex:1;min-width:90px}
.sev input{display:none}
.sev span{display:block;text-align:center;padding:10px;border-radius:12px;border:1.5px solid var(--line);font-weight:800;font-size:13px;cursor:pointer}
.sev input:checked+span.s-critical{background:var(--red);border-color:var(--red);color:#fff}
.sev input:checked+span.s-high{background:var(--amber);border-color:var(--amber);color:#fff}
.sev input:checked+span.s-moderate{background:var(--blue);border-color:var(--blue);color:#fff}
.tl{display:flex;flex-direction:column;gap:0;margin-top:6px}
.tl .t{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:14px}
.tl .t::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}
.tl .t:last-child::before{display:none}
.tl .t i{width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid var(--line);flex-shrink:0;display:grid;place-items:center;z-index:1}
.tl .t i svg{width:13px;height:13px}
.tl .t.done i{background:var(--green);border-color:var(--green);color:#fff}
.tl .t.done::before{background:var(--green)}
.tl .t.cur i{background:var(--blue);border-color:var(--blue);color:#fff;animation:pulse 1.6s infinite}
.tl .t b{font-size:14px}.tl .t span{display:block;font-size:12px;color:var(--muted)}
.tl .t.todo b{color:var(--muted)}
.eta{border-radius:20px;background:linear-gradient(135deg,#0B1A3A,#1E3A8A);color:#fff;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.eta b{font-family:'Sora';font-size:36px;line-height:1}
.eta small{opacity:.75;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.map-slot{height:340px;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#eef3fa;position:relative}
.map-slot.tall{height:440px}
.map-slot .map{position:absolute;inset:0}
.map-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;font-weight:700;text-align:center;padding:20px;z-index:500;pointer-events:none}
.mk{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px;border:3px solid #fff;box-shadow:0 6px 14px rgba(0,0,0,.25)}
.mk.amb{background:#EF4444}.mk.pickup{background:#F59E0B}.mk.hosp{background:#10B981}.mk.amb.idle{background:#1E6BFF}
.em-card{border-left:5px solid var(--line)}
.em-card.sev-critical{border-left-color:var(--red)}.em-card.sev-high{border-left-color:var(--amber)}.em-card.sev-moderate{border-left-color:var(--blue)}
.em-card.sel{outline:2px solid var(--blue);outline-offset:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink2);margin-top:8px}
.meta span{display:flex;align-items:center;gap:5px}
.meta svg{width:14px;height:14px;color:var(--muted)}

/* resources */
.res-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.res{border-radius:14px;padding:12px;border:1.5px solid var(--line);background:#fff}
.res b{font-family:'Sora';font-size:15px}
.res .rt{font-size:11px;color:var(--muted);font-weight:700}
.res select{margin-top:8px;width:100%;padding:6px 8px;border-radius:9px;border:1px solid var(--line);font-size:12.5px;font-weight:700;background:#fff}
.res.available{border-color:#b8ecd6;background:#F4FCF8}.res.occupied{border-color:#f7c3c3;background:#FFF6F6}.res.reserved{border-color:#fbe0ae;background:#FFFBF2}.res.maintenance{border-color:#dde3ec;background:#F7F9FC}
.barrow{display:grid;grid-template-columns:130px 1fr 40px;gap:10px;align-items:center;font-size:13px;margin-bottom:9px}
.barrow .bt{height:10px;background:var(--bg);border-radius:9px;overflow:hidden;display:flex}
.barrow .bt span{display:block;height:100%}
.barrow .lbl{font-weight:700;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barrow .v{text-align:right;font-weight:800}
.switch{position:relative;width:48px;height:28px;display:inline-block;flex-shrink:0}
.switch input{display:none}
.switch span{position:absolute;inset:0;background:#d5dce8;border-radius:99px;transition:.2s;cursor:pointer}
.switch span::after{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span::after{left:23px}
.qchips{display:flex;flex-wrap:wrap;gap:6px}
.qchip{font-family:'JetBrains Mono';font-weight:800;font-size:12px;padding:4px 8px;border-radius:8px;background:var(--bg);color:var(--ink2)}
.qchip.called,.qchip.in_consultation{background:var(--blue);color:#fff}.qchip.completed{background:var(--green-l);color:var(--green-d);text-decoration:line-through}.qchip.skipped,.qchip.cancelled{background:#f3f4f6;color:#aab;text-decoration:line-through}
.now-serving{font-family:'JetBrains Mono';font-weight:800;font-size:44px;line-height:1;color:var(--blue)}
.patient-box{background:var(--bg);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;margin:12px 0}
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.hello h2{font-size:26px;font-weight:800}
details.dx summary{cursor:pointer;list-style:none}
details.dx summary::-webkit-details-marker{display:none}
.rx{background:var(--bg);border-radius:14px;padding:14px;margin-top:12px;font-size:14px;display:grid;gap:10px}
.rx pre{font-family:inherit;white-space:pre-wrap;margin:0}
.rx small{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800}
.banner-warn{background:var(--amber-l);border:1px solid #fbe0ae;color:#8a5200;padding:12px 14px;border-radius:14px;font-size:14px;font-weight:600;margin-bottom:16px;display:flex;gap:10px;align-items:center}
.banner-warn svg{width:18px;height:18px;flex-shrink:0}
.mt{margin-top:16px}.mb16{margin-bottom:16px}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}}
@media (max-width:900px){
  .hero-in{grid-template-columns:1fr;padding-top:36px}
  .nav-links{display:none}
  .dash{grid-template-columns:1fr}
  .side{display:none}
  .m-logout{display:grid}
  .topbar{padding:12px 16px}
  .topbar h1{font-size:18px}
  main#main{padding:4px 14px 96px}
  .mnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-top:1px solid var(--line);overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .mnav button{flex:1 0 72px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:800;color:var(--muted);padding:6px 4px;border-radius:12px}
  .mnav button svg{width:20px;height:20px}
  .mnav button.on{color:var(--blue-d);background:var(--blue-l)}
  .g3{grid-template-columns:1fr}
  .g2{grid-template-columns:1fr}
  .live-pill .txt{display:none}
}
@media (max-width:560px){
  .row,.row3{grid-template-columns:1fr}
  .g4{grid-template-columns:1fr 1fr}
  .seg{grid-template-columns:repeat(2,1fr)}
  .token-nums .big{font-size:42px}
  .tstats b{font-size:17px}
  .node{width:104px;padding:8px}
  .node span{display:none}
  .stat b{font-size:20px}
  .barrow{grid-template-columns:90px 1fr 32px}
}

async function idToken(force) { const u = S.fbAuth && S.fbAuth.currentUser; return u ? u.getIdToken(!!force) : null; }
async function api(path, { method = 'GET', body, query } = {}) {
  const tok = await idToken().catch(() => null);

  const url = API_BASE + (S.apiMode === 'path' ? `/api/${path}${qs ? '?' + qs : ''}` : `/api/index?__p=${encodeURIComponent(path)}${qs ? '&' + qs : ''}`);
  let res;

    res = await fetch(url, { method, headers: { 'Content-Type': 'application/json', ...(tok ? { Authorization: 'Bearer ' + tok } : {}) }, body: body ? JSON.stringify(body) : undefined });
  } catch { throw new Error('Network error — cannot reach the Q-NIRVANA server. Check your connection and that server.js is running.'); }
  let data = null;
  try { data = await res.json(); } catch {}
  if (res.status === 401 && S.user) { logout(true); throw new Error('Session expired — please log in again'); }
  if (res.status === 403 && data && data.code === 'email_unverified' && S.user) { S.needVerify = true; render(); }

    catch (e) { throw e.name === 'AbortError' ? new Error('timed out after 12 s') : e; } finally { clearTimeout(t); }
  };
  let why = '';
  if (API.source === 'missing') { S.cfg = { realtime: false, unreachable: true, reason: 'no-backend' }; }
  else if (location.protocol === 'https:' && /^http:/.test(API_BASE) && !/^http:\/\/(localhost|127\.0\.0\.1)(:|\/|$)/.test(API_BASE)) {
    S.cfg = { realtime: false, unreachable: true, reason: 'mixed', why: 'this page is HTTPS but the backend URL is plain HTTP — browsers block that. Use an https:// backend URL.' };
  } else {
    const probe = async () => {
      try { S.apiMode = 'path'; return await getJson('/api/health'); }
      catch (e1) { why = e1.message; S.apiMode = 'q'; try { return await getJson('/api/index?__p=health'); } catch { S.apiMode = 'path'; return null; } }
    };
    S.cfg = await probe();
    if (!S.cfg && API.fallback) { API_BASE = API.fallback; API.source = 'QN_BACKEND_URL'; S.cfg = await probe(); } // this host has no backend → deployed server.js
    if (!S.cfg) S.cfg = { realtime: false, unreachable: true, reason: 'down', why: /Failed to fetch|NetworkError|Load failed/i.test(why) ? 'network error — the server is not running, the URL is wrong, or CORS is blocked' : why };
  }
  if (S.cfg.unreachable) console.error('[Q-NIRVANA] backend unreachable:', apiLabel(), S.cfg.reason, S.cfg.why || '');
  if (S.cfg && S.cfg.maps_key) loadGoogleMaps(S.cfg.maps_key);

async function checkVerified(btn) {

async function resendVerify(btn) {

    if (r === 'already') { await refreshVerification(true); toast('Already verified', 'Firebase shows this email is already verified.', 'success'); }

}

async function submitAuth(e) {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target));
  const err = (m) => { $('#auth-err').innerHTML = `<div class="form-err">${esc(m)}</div>`; };
  const complete = S.authMode === 'complete';
  if (!complete && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(f.email || '')) return err('Please enter a valid email address');
  if (!complete && !f.password) return err('Password is required');
  const btn = $('#auth-btn'); busyBtn(btn, true);
  let created = null;
  try {
    if (S.authMode === 'login') {
      S.loggingIn = true;
      try { await S.fbAuth.signInWithEmailAndPassword(f.email.trim(), f.password); }
      catch (x) { S.loggingIn = false; throw new Error(fbMsg(x) + (/invalid-(credential|login-credentials)|wrong-password|user-not-found/.test(x.code || '') ? '. Accounts created before Firebase sign-in was enabled must register again with the same email.' : '')); }
      try { S.tab = null; await startSession(true, true); } // Firebase ID token → server.js verifies (Firebase Admin) → MySQL profile → dashboard
      catch (x) { S.loggingIn = false; try { await S.fbAuth.signOut(); } catch {} throw new Error(x.message || 'Could not load your profile'); }
      S.loggingIn = false;
      return;
    }
    if ((f.full_name || '').trim().length < 2) throw new Error('Please enter your full name');
    if (!/^\+?[\d\s-]{7,20}$/.test(f.phone || '')) throw new Error('Please enter a valid phone number');
    if (!complete && (f.password.length < 8 || !/[A-Za-z]/.test(f.password) || !/\d/.test(f.password))) throw new Error('Password must be at least 8 characters with letters and numbers');
    if (S.regRole === 'hospital') {
      if ((f.hospital_name || '').trim().length < 2) throw new Error('Hospital name is required');
      if (!f.designation) throw new Error('Please choose your designation');
      if ((f.department || '').trim().length < 2) throw new Error('Department is required');
    }
    const { full_name, email, phone, password, access_code, ...profile } = f;
    S.registering = true;
    if (!complete) {
      try { created = (await S.fbAuth.createUserWithEmailAndPassword(email.trim(), password)).user; } catch (x) { throw new Error(fbMsg(x)); }
    }
    await api('register', { method: 'POST', body: { role: S.regRole, full_name, phone, access_code, profile } });
    const u = S.fbAuth.currentUser;
    let sendErr = null, sent = false;
    if (u && !u.emailVerified) { try { sent = (await sendVerificationEmail()) === 'sent'; } catch (e) { sendErr = e; } } // sent once at signup, never on login
    S.registering = false;
    await afterAuth();
    if (sendErr) toast('Account created — verification email NOT sent', fbMsg(sendErr) + ' — use “Resend Verification Email” below.', 'error');
    else toast('Registration successful', sent ? `Verification email sent to ${u.email}. Open the link (check Spam too), then click “I've verified” to open your dashboard.` : 'Your profile is saved.', 'success');
  } catch (x) {
    if (created) { try { await created.delete(); } catch {} } // roll back the Firebase account if the profile could not be created
    S.registering = false; err(x.message); busyBtn(btn, false);
  }
}

      <main id="main"></main>

function go(id) { if (!tabsFor().some((t) => t.id === id)) return toast('Not available', 'Your designation does not have access to this section.', 'warning'); S.tab = id; const np = $('#npanel'); if (np) np.remove(); render(); window.scrollTo(0, 0); }
async function loadTab(spin = true) {
  const t = currentTab(), main = $('#main'); if (!t || !main) return;
  const seq = ++S.seq;
  if (spin) main.innerHTML = loader();
  try {
    const data = t.load ? await t.load() : {};
    if (seq !== S.seq || !$('#main')) return;
    S.d[t.id] = data;
    $('#main').innerHTML = t.view(data);
    if (t.after) t.after(data);
  } catch (e) {
    if (seq !== S.seq) return;
    if (spin || !main.children.length) main.innerHTML = `<div class="card">${empty('alert', 'Could not load data', e.message, `<button class="btn primary" onclick="loadTab(true)">${ic('refresh')} Retry</button>`)}</div>`;
  }
}
function rerender() { const t = currentTab(); if (!t || !$('#main')) return; $('#main').innerHTML = t.view(S.d[t.id]); if (t.after) t.after(S.d[t.id]); }
async function act(fn, btn, okTitle, okMsg) {
  busyBtn(btn, true);
  try { const r = await fn(); if (okTitle) toast(okTitle, okMsg || '', 'success'); await loadTab(false); return r; }
  catch (e) { toast('Action failed', e.message, 'error'); busyBtn(btn, false); }
}

}
